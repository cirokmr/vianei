name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint · Types · Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run format:check
      - name: Payload types and import map are up to date
        env:
          PAYLOAD_SECRET: ci-only-secret
          DATABASE_URL: postgres://unused
        run: |
          npm run generate:types
          npm run generate:importmap
          git diff --exit-code -- src/payload-types.ts "src/app/(payload)/admin/importMap.js"

  app:
    name: Build · E2E + axe · Lighthouse
    needs: quality
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: vianei
          POSTGRES_PASSWORD: vianei
          POSTGRES_DB: vianei
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U vianei"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    # Test-only values; production secrets live in Vercel.
    env:
      DATABASE_URL: postgres://vianei:vianei@localhost:5432/vianei
      PAYLOAD_SECRET: ci-only-payload-secret
      PREVIEW_SECRET: ci-only-preview-secret
      NEXT_PUBLIC_SERVER_URL: http://localhost:3100
      NEXT_PUBLIC_SITE_URL: http://localhost:3100
      SEED_ADMIN_EMAIL: ci@vianei.local
      SEED_ADMIN_PASSWORD: ci-password-123
      # Builds the internal /lab page so the motion primitives are tested.
      ENABLE_LAB: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run migrate
      - run: npm run seed
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
      # A cold `next start` skews the first Lighthouse run (TBT > 1.5 s on the
      # runner). Warm the server up, then measure 5 runs and assert the median.
      - name: Warm up server
        run: |
          npm run start -- -p 3200 &
          npx -y wait-on@8 -t 60000 http://localhost:3200/
          for path in / /quem-somos /noticias; do
            for i in 1 2 3; do curl -s -o /dev/null "http://localhost:3200$path"; done
            # Prime the image optimizer so the first run doesn't pay for AVIF encoding.
            curl -s "http://localhost:3200$path" | grep -oE '/_next/image\?[^" ,]+' | sed 's/&amp;/\&/g' | sort -u |
              xargs -P 4 -I{} curl -s -o /dev/null -H "Accept: image/avif,image/webp" "http://localhost:3200{}"
          done
      - run: >-
          npm run lhci -- --collect.startServerCommand=""
          --collect.url=http://localhost:3200/ --collect.url=http://localhost:3200/quem-somos
          --collect.url=http://localhost:3200/noticias
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lighthouse-reports
          path: .lighthouseci/reports
          retention-days: 14
