name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint · Types · Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run format:check
      - name: Payload types and import map are up to date
        env:
          PAYLOAD_SECRET: ci-only-secret
          DATABASE_URL: postgres://unused
        run: |
          npm run generate:types
          npm run generate:importmap
          git diff --exit-code -- src/payload-types.ts "src/app/(payload)/admin/importMap.js"

  app:
    name: Build · E2E + axe · Lighthouse
    needs: quality
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: vianei
          POSTGRES_PASSWORD: vianei
          POSTGRES_DB: vianei
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U vianei"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    # Test-only values; production secrets live in Vercel.
    env:
      DATABASE_URL: postgres://vianei:vianei@localhost:5432/vianei
      PAYLOAD_SECRET: ci-only-payload-secret
      PREVIEW_SECRET: ci-only-preview-secret
      NEXT_PUBLIC_SERVER_URL: http://localhost:3100
      NEXT_PUBLIC_SITE_URL: http://localhost:3100
      SEED_ADMIN_EMAIL: ci@vianei.local
      SEED_ADMIN_PASSWORD: ci-password-123
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run migrate
      - run: npm run seed
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
      - run: npm run lhci
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lighthouse-reports
          path: .lighthouseci/reports
          retention-days: 14
